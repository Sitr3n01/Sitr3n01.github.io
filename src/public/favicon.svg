<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
<!-- Favicon: o S do logo em células, como as do fundo ASCII, em #1d1d1d sobre o fundo #e5e4e0. favicon.ico e
     apple-touch-icon.png saem daqui: npm run images. -->
<rect width="8" height="8" fill="#e5e4e0"/>
<g fill="#1d1d1d">
<rect x="2" y="1" width="5" height="1"/>
<rect x="1" y="2" width="1" height="1"/>
<rect x="2" y="3" width="4" height="1"/>
<rect x="6" y="4" width="1" height="2"/>
<rect x="1" y="6" width="5" height="1"/>
</g>
</svg>
